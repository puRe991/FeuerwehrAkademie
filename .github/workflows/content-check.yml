name: Inhalts-Prüfung

# Automatisierte Qualitätssicherung der Lerninhalte:
# prüft Fragenbank, Curriculum, Prüfungssets, Glossar, Karteikarten,
# Planspiele, Einsatzkompass und Quellenangaben auf strukturelle Fehler
# und kaputte Querverweise. Läuft bei jedem Push und Pull Request.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Inhalte validieren
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-Check aller JS-Module
        run: |
          find assets/js -name '*.js' -print0 \
            | xargs -0 -n1 node --check
          node --check service-worker.js

      - name: Inhalts-Validierung
        run: node scripts/validate-content.mjs
